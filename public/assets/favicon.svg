  <!-- Cyber Eyes -->
  <path d="M 73,50 L 79,52 L 77,58 L 71,56 Z" fill="#060609"/>
  <path d="M 74,52 L 77,53 L 76,56 L 73,55 Z" fill="#fbcfe8" filter="url(#eyeGlow)"/>
  <path d="M 127,150 L 121,148 L 123,142 L 129,144 Z" fill="#060609"/>
  <path d="M 126,148 L 123,147 L 124,144 L 127,145 Z" fill="#fbcfe8" filter="url(#eyeGlow)"/>
</svg>