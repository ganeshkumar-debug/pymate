    <path d="M 102,164 L 82,164 L 88,152 L 106,152 Z" fill="url(#rogGradRev)" opacity="1"/>
    <path d="M 80,164 L 58,156 L 66,144 L 86,152 Z" fill="url(#rogGradRev)" opacity="1"/>
    <path d="M 56,154 L 44,142 L 54,132 L 64,142 Z" fill="url(#accentFacet)" opacity="1"/>
    <path d="M 44,139 L 44,118 L 56,122 L 56,136 Z" fill="url(#rogGradRev)" opacity="1"/>
    <path d="M 44,115 L 46,96 L 58,102 L 56,118 Z" fill="url(#rogGradRev)" opacity="0.88"/>
    <path d="M 48,94 L 62,82 L 72,92 L 60,100 Z" fill="url(#rogGradRev)" opacity="1"/>
    <path d="M 64,82 L 84,82 L 82,94 L 74,94 Z" fill="url(#rogGradRev)" opacity="1"/>
    <path d="M 86,82 L 98,88 L 94,96 L 84,94 Z" fill="url(#accentFacet)" opacity="1"/>
  </g>
  <!-- Kinetic Outer Splinter Shards -->
  <path d="M 76,28 L 92,30 L 84,34 Z" fill="url(#rogGrad)" opacity="0.9"/>
  <path d="M 104,28 L 122,31 L 114,34 Z" fill="url(#rogGrad)" opacity="0.9"/>
  <path d="M 148,36 L 164,44 L 154,48 Z" fill="url(#rogGrad)" opacity="0.9"/>
  <path d="M 164,68 L 166,86 L 161,78 Z" fill="url(#rogGrad)" opacity="0.9"/>
  <path d="M 36,52 L 44,46 L 42,56 Z" fill="url(#rogGrad)" opacity="0.9"/>
  <path d="M 38,68 L 46,70 L 40,78 Z" fill="url(#rogGrad)" opacity="0.9"/>
  <path d="M 124,172 L 108,170 L 116,166 Z" fill="url(#rogGradRev)" opacity="0.9"/>
  <path d="M 96,172 L 78,169 L 86,166 Z" fill="url(#rogGradRev)" opacity="0.9"/>
  <path d="M 52,164 L 36,156 L 46,152 Z" fill="url(#rogGradRev)" opacity="0.9"/>
