<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="rogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="28%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#d946ef"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <linearGradient id="rogGradRev" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="25%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="deepFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#701a75" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <radialGradient id="ambientBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
      </defs>
  <!-- Cyber Obsidian Badge Background -->
  <rect width="200" height="200" rx="44" fill="#060609"/>
  <rect width="200" height="200" rx="44" stroke="#1f1830" stroke-width="1.5" fill="none"/>
  <!-- Ambient Neon Core Bloom -->
  <circle cx="100" cy="100" r="82" fill="url(#ambientBloom)"/>
  <!-- 3D Recessed Facets -->
  <path d="M 86,66 L 98,66 L 108,80 L 94,80 Z" fill="url(#deepFacet)"/>
  <path d="M 100,82 L 118,82 L 116,94 L 96,94 Z" fill="url(#deepFacet)"/>
  <path d="M 120,82 L 138,82 L 132,96 L 118,96 Z" fill="url(#deepFacet)"/>
  <path d="M 114,134 L 102,134 L 92,120 L 106,120 Z" fill="url(#deepFacet)"/>
  <path d="M 100,118 L 82,118 L 84,106 L 104,106 Z" fill="url(#deepFacet)"/>
  <path d="M 80,118 L 62,118 L 68,104 L 82,104 Z" fill="url(#deepFacet)"/>
  <!-- Primary Cyber Shards -->
  <g filter="url(#rogGlow)">
    <path d="M 46,56 L 56,46 L 68,46 L 62,58 L 50,64 Z" fill="url(#rogGrad)" opacity="1"/>
    <path d="M 60,44 L 78,36 L 96,36 L 92,46 L 70,44 Z" fill="url(#accentFacet)" opacity="1"/>
    <path d="M 52,66 L 62,60 L 74,66 L 68,76 L 56,76 Z" fill="url(#rogGrad)" opacity="1"/>
