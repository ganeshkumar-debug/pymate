    <path d="M 136,118 L 116,118 L 118,106 L 126,106 Z" fill="url(#rogGrad)" opacity="1"/>
    <path d="M 114,118 L 102,112 L 106,104 L 116,106 Z" fill="url(#accentFacet)" opacity="1"/>
    <path d="M 154,144 L 144,154 L 132,154 L 138,142 L 150,136 Z" fill="url(#rogGradRev)" opacity="1"/>
    <path d="M 140,156 L 122,164 L 104,164 L 108,154 L 130,156 Z" fill="url(#accentFacet)" opacity="1"/>
